<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XingClaw Agent 控制台</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --border: #d8dee9;
            --text: #1f2937;
            --muted: #687385;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #0f766e;
            --warning: #b45309;
            --danger: #b91c1c;
            --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            min-height: 36px;
            padding: 0 12px;
            background: var(--primary);
            color: #fff;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .shell {
            display: grid;
            grid-template-columns: 240px minmax(360px, 1fr) 360px;
            min-height: 100vh;
        }

        .sidebar,
        .inspector {
            background: var(--panel);
            border-color: var(--border);
            border-style: solid;
        }

        .sidebar {
            border-width: 0 1px 0 0;
            padding: 18px 16px;
        }

        .brand {
            margin: 0 0 18px;
            font-size: 18px;
            line-height: 1.2;
        }

        .label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .session-row {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .session-row input {
            min-width: 0;
            width: 100%;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 10px;
            color: var(--text);
            background: #fff;
        }

        .status-list {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }

        .status-item {
            border-left: 3px solid var(--border);
            padding-left: 10px;
        }

        .status-item strong {
            display: block;
            font-size: 13px;
        }

        .status-item span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .main {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 64px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.86);
        }

        .topbar h2 {
            margin: 0;
            font-size: 17px;
        }

        .stream-state {
            color: var(--muted);
            font-size: 13px;
        }

        .chat {
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 78%;
            margin-bottom: 14px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: var(--panel);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        .message.user {
            margin-left: auto;
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .message.assistant.loading {
            color: var(--muted);
        }

        .composer {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            padding: 14px 20px 18px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }

        .composer textarea {
            width: 100%;
            min-height: 48px;
            max-height: 160px;
            resize: vertical;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
        }

        .secondary {
            background: #e5e7eb;
            color: var(--text);
        }

        .secondary:hover {
            background: #d1d5db;
        }

        .inspector {
            border-width: 0 0 0 1px;
            display: grid;
            grid-template-rows: auto 1fr;
            min-height: 100vh;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            min-height: 44px;
            color: var(--muted);
            background: var(--panel);
            border-radius: 0;
        }

        .tab.active {
            color: var(--primary);
            background: var(--panel-soft);
            box-shadow: inset 0 -2px 0 var(--primary);
        }

        .tab:hover {
            color: var(--text);
            background: var(--panel-soft);
        }

        .panel {
            display: none;
            overflow-y: auto;
            padding: 16px;
        }

        .panel.active {
            display: block;
        }

        .empty {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .event-row,
        .confirm-row {
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-soft);
            padding: 10px;
        }

        .event-row strong,
        .confirm-row strong {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .event-row pre,
        .confirm-row pre {
            margin: 8px 0 0;
            max-height: 180px;
            overflow: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #334155;
            font-size: 12px;
        }

        .meta {
            color: var(--muted);
            font-size: 12px;
        }

        .badge {
            display: inline-block;
            border-radius: 999px;
            padding: 2px 8px;
            color: #fff;
            background: var(--muted);
            font-size: 12px;
        }

        .badge.success {
            background: var(--success);
        }

        .badge.warning {
            background: var(--warning);
        }

        .badge.danger {
            background: var(--danger);
        }

        .dialog-backdrop {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.38);
        }

        .dialog-backdrop.hidden {
            display: none;
        }

        .dialog {
            width: min(560px, 100%);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: var(--shadow);
            padding: 18px;
        }

        .dialog h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .danger {
            background: var(--danger);
        }

        .danger:hover {
            background: #991b1b;
        }

        @media (max-width: 1100px) {
            .shell {
                grid-template-columns: 200px minmax(320px, 1fr);
            }

            .inspector {
                grid-column: 1 / -1;
                min-height: 420px;
                border-width: 1px 0 0;
            }
        }

        @media (max-width: 760px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .sidebar,
            .inspector {
                min-height: auto;
                border-width: 0 0 1px;
            }

            .main {
                min-height: 70vh;
            }

            .composer {
                grid-template-columns: 1fr;
            }

            .message {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <h1 class="brand">XingClaw Agent 控制台</h1>
        <label class="label" for="sessionInput">Session ID</label>
        <div class="session-row">
            <input id="sessionInput" autocomplete="off">
            <button id="newSessionButton" class="secondary" type="button">新建</button>
        </div>
        <div class="status-list">
            <div class="status-item">
                <strong>流式响应</strong>
                <span id="streamStatus">空闲</span>
            </div>
            <div class="status-item">
                <strong>当前 Trace</strong>
                <span id="currentTrace">未开始</span>
            </div>
            <div class="status-item">
                <strong>确认队列</strong>
                <span id="confirmationStatus">待刷新</span>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <h2>聊天</h2>
            <span id="agentState" class="stream-state">Agent 正在等待输入</span>
        </header>

        <section id="chatMessages" class="chat" aria-live="polite">
            <div class="message assistant">你好，我是 XingClaw Agent。你可以在这里发起任务，并查看工具调用、Trace 和敏感操作确认。</div>
        </section>

        <section class="composer">
            <textarea id="messageInput" placeholder="输入指令，Ctrl + Enter 发送"></textarea>
            <button id="sendButton" type="button">发送</button>
            <button id="stopButton" class="secondary" type="button" disabled>停止</button>
        </section>
    </main>

    <aside class="inspector">
        <nav class="tabs" aria-label="控制台详情">
            <button class="tab active" data-panel="toolsPanel" type="button">工具调用</button>
            <button class="tab" data-panel="tracePanel" type="button">Trace</button>
            <button class="tab" data-panel="confirmationsPanel" type="button">敏感操作确认</button>
        </nav>

        <section id="toolsPanel" class="panel active">
            <div id="toolTimeline">
                <p class="empty">暂无工具调用。</p>
            </div>
        </section>

        <section id="tracePanel" class="panel">
            <div id="traceContent">
                <p class="empty">暂无 Trace。发送消息后会显示模型请求、工具调用、耗时、结果和错误。</p>
            </div>
        </section>

        <section id="confirmationsPanel" class="panel">
            <div id="confirmationQueue">
                <p class="empty">暂无待确认敏感操作。</p>
            </div>
        </section>
    </aside>
</div>

<div id="confirmDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="dialog">
        <h3 id="confirmTitle">确认敏感操作</h3>
        <p id="confirmSummary" class="meta"></p>
        <pre id="confirmPayload"></pre>
        <div class="dialog-actions">
            <button id="rejectButton" class="secondary" type="button">拒绝</button>
            <button id="approveButton" class="danger" type="button">批准执行</button>
        </div>
    </div>
</div>

<script>
    const state = {
        sessionId: localStorage.getItem('agent.console.sessionId') || createSessionId(),
        activeTraceId: null,
        abortController: null,
        activeAssistantMessage: null,
        selectedConfirmation: null
    };

    const elements = {
        sessionInput: document.getElementById('sessionInput'),
        newSessionButton: document.getElementById('newSessionButton'),
        streamStatus: document.getElementById('streamStatus'),
        currentTrace: document.getElementById('currentTrace'),
        confirmationStatus: document.getElementById('confirmationStatus'),
        agentState: document.getElementById('agentState'),
        chatMessages: document.getElementById('chatMessages'),
        messageInput: document.getElementById('messageInput'),
        sendButton: document.getElementById('sendButton'),
        stopButton: document.getElementById('stopButton'),
        toolTimeline: document.getElementById('toolTimeline'),
        traceContent: document.getElementById('traceContent'),
        confirmationQueue: document.getElementById('confirmationQueue'),
        confirmDialog: document.getElementById('confirmDialog'),
        confirmSummary: document.getElementById('confirmSummary'),
        confirmPayload: document.getElementById('confirmPayload'),
        approveButton: document.getElementById('approveButton'),
        rejectButton: document.getElementById('rejectButton')
    };

    elements.sessionInput.value = state.sessionId;
    localStorage.setItem('agent.console.sessionId', state.sessionId);
    bindEvents();
    loadConfirmations();
    loadRecentTraces();

    function bindEvents() {
        elements.sendButton.addEventListener('click', sendMessage);
        elements.stopButton.addEventListener('click', stopStream);
        elements.newSessionButton.addEventListener('click', () => {
            state.sessionId = createSessionId();
            elements.sessionInput.value = state.sessionId;
            localStorage.setItem('agent.console.sessionId', state.sessionId);
            setStatus('新会话已创建', '空闲');
            loadConfirmations();
        });
        elements.sessionInput.addEventListener('change', () => {
            state.sessionId = elements.sessionInput.value.trim() || createSessionId();
            elements.sessionInput.value = state.sessionId;
            localStorage.setItem('agent.console.sessionId', state.sessionId);
            loadConfirmations();
        });
        elements.messageInput.addEventListener('keydown', event => {
            if (event.key === 'Enter' && event.ctrlKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => activatePanel(tab.dataset.panel));
        });
        elements.approveButton.addEventListener('click', () => decideConfirmation('approve'));
        elements.rejectButton.addEventListener('click', () => decideConfirmation('reject'));
    }

    async function sendMessage() {
        const text = elements.messageInput.value.trim();
        if (!text || state.abortController) {
            return;
        }

        appendMessage(text, 'user');
        elements.messageInput.value = '';
        state.activeAssistantMessage = appendMessage('Agent 正在思考...', 'assistant loading');
        state.abortController = new AbortController();
        elements.sendButton.disabled = true;
        elements.stopButton.disabled = false;
        setStatus('Agent 正在思考和流式响应', '连接中');

        try {
            const response = await fetch('/api/agent/chat/stream', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sessionId: state.sessionId,
                    message: text
                }),
                signal: state.abortController.signal
            });
            if (!response.ok || !response.body) {
                throw new Error('流式请求失败：' + response.status);
            }
            await readSseStream(response.body);
        } catch (error) {
            if (error.name !== 'AbortError') {
                markAssistant(error.message, true);
                setStatus('请求失败', '错误');
            }
        } finally {
            state.abortController = null;
            elements.sendButton.disabled = false;
            elements.stopButton.disabled = true;
            elements.messageInput.focus();
            loadConfirmations();
        }
    }

    function stopStream() {
        if (state.abortController) {
            state.abortController.abort();
            setStatus('已停止响应', '已停止');
        }
    }

    async function readSseStream(stream) {
        const reader = stream.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
            const {done, value} = await reader.read();
            if (done) {
                break;
            }
            buffer += decoder.decode(value, {stream: true});
            const blocks = buffer.split('\n\n');
            buffer = blocks.pop() || '';
            blocks.forEach(handleSseBlock);
        }
        if (buffer.trim()) {
            handleSseBlock(buffer);
        }
    }

    function handleSseBlock(block) {
        const lines = block.split('\n');
        const event = (lines.find(line => line.startsWith('event:')) || '').replace('event:', '').trim();
        const dataLine = (lines.find(line => line.startsWith('data:')) || '').replace('data:', '').trim();
        const data = parseJson(dataLine);

        if (data.traceId) {
            state.activeTraceId = data.traceId;
            elements.currentTrace.textContent = data.traceId;
        }

        if (event === 'started') {
            setStatus('Agent 正在思考', '流式连接已建立');
        } else if (event === 'token') {
            markAssistant(data.content || '', false);
            setStatus('正在接收响应', '流式响应中');
        } else if (event === 'tool_call' || event === 'observation') {
            appendToolEvent(event, data);
        } else if (event === 'final') {
            markAssistant(data.answer || data.content || '', false);
            setStatus('响应完成', '空闲');
            if (data.traceId) {
                loadTrace(data.traceId);
            }
        } else if (event === 'error') {
            markAssistant(data.error || '请求失败', true);
            setStatus('响应失败', '错误');
            if (data.traceId) {
                loadTrace(data.traceId);
            }
        }
    }

    async function loadTrace(traceId) {
        const response = await fetch('/api/agent/traces/' + encodeURIComponent(traceId));
        if (!response.ok) {
            return;
        }
        const trace = await response.json();
        renderTrace(trace);
        renderToolTimeline(trace.events || []);
    }

    async function loadRecentTraces() {
        const response = await fetch('/api/agent/traces?limit=5');
        if (!response.ok) {
            return;
        }
        const traces = await response.json();
        if (!state.activeTraceId && traces.length > 0) {
            state.activeTraceId = traces[0].traceId;
            elements.currentTrace.textContent = traces[0].traceId;
            renderTrace(traces[0]);
        }
    }

    async function loadConfirmations() {
        const response = await fetch('/api/agent/tool-confirmations?sessionId=' + encodeURIComponent(state.sessionId));
        if (!response.ok) {
            elements.confirmationStatus.textContent = '确认接口不可用';
            return;
        }
        const confirmations = await response.json();
        elements.confirmationStatus.textContent = confirmations.length + ' 个待确认';
        renderConfirmations(confirmations);
    }

    async function decideConfirmation(action) {
        const item = state.selectedConfirmation;
        if (!item) {
            return;
        }
        const url = '/api/agent/tool-confirmations/' + encodeURIComponent(item.id) + '/' + action;
        const options = action === 'reject'
                ? {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({reason: 'user cancelled'})
                }
                : {method: 'POST'};
        await fetch(url, options);
        state.selectedConfirmation = null;
        elements.confirmDialog.classList.add('hidden');
        loadConfirmations();
    }

    function renderTrace(trace) {
        elements.traceContent.innerHTML = '';
        const header = document.createElement('div');
        header.className = 'event-row';
        header.innerHTML = `
            <strong>${escapeHtml(trace.traceId)}</strong>
            <span class="meta">session=${escapeHtml(trace.sessionId)} · ${escapeHtml(trace.status)} · ${trace.durationMs || 0}ms</span>
            <pre>${escapeHtml(trace.userMessage || '')}</pre>
        `;
        elements.traceContent.appendChild(header);

        (trace.events || []).forEach(event => {
            const row = document.createElement('div');
            row.className = 'event-row';
            row.innerHTML = `
                <strong>${escapeHtml(event.type)} ${event.toolName ? '· ' + escapeHtml(event.toolName) : ''}</strong>
                <span class="meta">step=${event.step || 0} · duration=${event.durationMs || 0}ms</span>
                <pre>${escapeHtml(event.contentPreview || event.argumentsPreview || event.errorMessage || JSON.stringify(event.metadata || {}, null, 2))}</pre>
            `;
            elements.traceContent.appendChild(row);
        });
    }

    function renderToolTimeline(events) {
        const toolEvents = events.filter(event => event.type === 'TOOL_CALL' || event.type === 'TOOL_OBSERVATION');
        elements.toolTimeline.innerHTML = '';
        if (toolEvents.length === 0) {
            elements.toolTimeline.innerHTML = '<p class="empty">暂无工具调用。</p>';
            return;
        }
        toolEvents.forEach(event => appendToolEvent(event.type, event));
    }

    function appendToolEvent(type, data) {
        if (elements.toolTimeline.querySelector('.empty')) {
            elements.toolTimeline.innerHTML = '';
        }
        const row = document.createElement('div');
        row.className = 'event-row';
        const ok = data.success === true;
        const failed = data.success === false;
        const badgeClass = ok ? 'success' : failed ? 'danger' : 'warning';
        row.innerHTML = `
            <strong>${escapeHtml(data.toolName || type)}</strong>
            <span class="badge ${badgeClass}">${escapeHtml(type)}</span>
            <pre>${escapeHtml(data.argumentsPreview || data.contentPreview || data.error || JSON.stringify(data, null, 2))}</pre>
        `;
        elements.toolTimeline.appendChild(row);
    }

    function renderConfirmations(confirmations) {
        elements.confirmationQueue.innerHTML = '';
        if (confirmations.length === 0) {
            elements.confirmationQueue.innerHTML = '<p class="empty">暂无待确认敏感操作。</p>';
            return;
        }
        confirmations.forEach(item => {
            const row = document.createElement('div');
            row.className = 'confirm-row';
            row.innerHTML = `
                <strong>${escapeHtml(item.toolName)}</strong>
                <span class="meta">trace=${escapeHtml(item.traceId || '-')}</span>
                <pre>${escapeHtml(item.argumentsPreview || '')}</pre>
                <button type="button">查看</button>
            `;
            row.querySelector('button').addEventListener('click', () => openConfirmDialog(item));
            elements.confirmationQueue.appendChild(row);
        });
    }

    function openConfirmDialog(item) {
        state.selectedConfirmation = item;
        elements.confirmSummary.textContent = item.toolName + ' · trace=' + (item.traceId || '-');
        elements.confirmPayload.textContent = item.argumentsPreview || '';
        elements.confirmDialog.classList.remove('hidden');
    }

    function activatePanel(panelId) {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.panel === panelId);
        });
        document.querySelectorAll('.panel').forEach(panel => {
            panel.classList.toggle('active', panel.id === panelId);
        });
    }

    function appendMessage(text, role) {
        const message = document.createElement('div');
        message.className = 'message ' + role;
        message.textContent = text;
        elements.chatMessages.appendChild(message);
        elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        return message;
    }

    function markAssistant(text, isError) {
        if (!state.activeAssistantMessage) {
            state.activeAssistantMessage = appendMessage('', 'assistant');
        }
        state.activeAssistantMessage.className = 'message assistant' + (isError ? ' danger-text' : '');
        state.activeAssistantMessage.textContent = text;
        elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
    }

    function setStatus(agentState, streamStatus) {
        elements.agentState.textContent = agentState;
        elements.streamStatus.textContent = streamStatus;
    }

    function createSessionId() {
        return 'console-' + Math.random().toString(36).slice(2, 9);
    }

    function parseJson(text) {
        if (!text) {
            return {};
        }
        try {
            return JSON.parse(text);
        } catch (error) {
            return {content: text};
        }
    }

    function escapeHtml(value) {
        return String(value == null ? '' : value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
    }
</script>
</body>
</html>
