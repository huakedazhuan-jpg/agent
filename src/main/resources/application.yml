spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: xingclaw-agent
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:xingclaw_agent}
    username: ${POSTGRES_USER:xingclaw_agent}
    password: ${POSTGRES_PASSWORD:xingclaw-local-password}
    hikari:
      maximum-pool-size: ${POSTGRES_MAX_POOL_SIZE:10}
      minimum-idle: ${POSTGRES_MIN_IDLE:1}
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT_MS:2000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:xingclaw-local-redis}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration/postgresql
  sql:
    init:
      mode: never
  ai:
    openai:
      api-key: ${MOONSHOT_API_KEY}
      base-url: ${MOONSHOT_BASE_URL:https://api.moonshot.ai}
      chat:
        options:
          model: ${MOONSHOT_MODEL:kimi-k2.5}
          temperature: ${MOONSHOT_TEMPERATURE:1}
          max-tokens: ${MOONSHOT_MAX_TOKENS:16000}

feishu:
  app-id: ${FEISHU_APP_ID}
  app-secret: ${FEISHU_APP_SECRET}
  verification-token: ${FEISHU_VERIFICATION_TOKEN:}
  encrypt-key: ${FEISHU_ENCRYPT_KEY:}
  async:
    core-size: ${FEISHU_ASYNC_CORE_SIZE:2}
    max-size: ${FEISHU_ASYNC_MAX_SIZE:4}
    queue-capacity: ${FEISHU_ASYNC_QUEUE_CAPACITY:100}
  inbox:
    repository: ${FEISHU_INBOX_REPOSITORY:memory}
    max-attempts: ${FEISHU_INBOX_MAX_ATTEMPTS:3}
    retry-delay: ${FEISHU_INBOX_RETRY_DELAY:30s}
    processing-timeout: ${FEISHU_INBOX_PROCESSING_TIMEOUT:5m}
    poll-interval: ${FEISHU_INBOX_POLL_INTERVAL:30s}
    poll-batch-size: ${FEISHU_INBOX_POLL_BATCH_SIZE:20}
  outbox:
    repository: ${FEISHU_OUTBOX_REPOSITORY:memory}
    max-attempts: ${FEISHU_OUTBOX_MAX_ATTEMPTS:5}
    retry-delay: ${FEISHU_OUTBOX_RETRY_DELAY:30s}
    processing-timeout: ${FEISHU_OUTBOX_PROCESSING_TIMEOUT:5m}
    poll-interval: ${FEISHU_OUTBOX_POLL_INTERVAL:5s}
    poll-batch-size: ${FEISHU_OUTBOX_POLL_BATCH_SIZE:20}

tavily:
  api-key: ${TAVILY_API_KEY}

market-data:
  twelve-data:
    api-key: ${TWELVE_DATA_API_KEY:demo}
    base-url: ${TWELVE_DATA_BASE_URL:https://api.twelvedata.com/quote}
    connect-timeout: ${TWELVE_DATA_CONNECT_TIMEOUT:10s}
    read-timeout: ${TWELVE_DATA_READ_TIMEOUT:20s}

agent:
  context:
    max-input-tokens: ${AGENT_CONTEXT_MAX_INPUT_TOKENS:12000}
    max-current-user-tokens: ${AGENT_CONTEXT_MAX_CURRENT_USER_TOKENS:4000}
    system-tokens: ${AGENT_CONTEXT_SYSTEM_TOKENS:1500}
    long-term-memory-tokens: ${AGENT_CONTEXT_LONG_TERM_MEMORY_TOKENS:2000}
    summary-tokens: ${AGENT_CONTEXT_SUMMARY_TOKENS:1200}
    recent-message-tokens: ${AGENT_CONTEXT_RECENT_MESSAGE_TOKENS:3500}
    tool-observation-tokens: ${AGENT_CONTEXT_TOOL_OBSERVATION_TOKENS:1800}
    reserved-protocol-tokens: ${AGENT_CONTEXT_RESERVED_PROTOCOL_TOKENS:2000}
  memory-processing:
    poll-interval: ${AGENT_MEMORY_PROCESSING_POLL_INTERVAL:5s}
  audit:
    repository: ${AGENT_AUDIT_REPOSITORY:memory}
  runtime:
    repository: ${AGENT_RUNTIME_REPOSITORY:memory}
    max-steps: ${AGENT_RUNTIME_MAX_STEPS:5}
    lease-duration: ${AGENT_RUNTIME_LEASE_DURATION:2m}
    heartbeat-interval: ${AGENT_RUNTIME_HEARTBEAT_INTERVAL:30s}
    recovery-batch-size: ${AGENT_RUNTIME_RECOVERY_BATCH_SIZE:10}
    max-recovery-attempts: ${AGENT_RUNTIME_MAX_RECOVERY_ATTEMPTS:3}
    recovery-interval: ${AGENT_RUNTIME_RECOVERY_INTERVAL:15s}
    event-replay-limit: ${AGENT_RUNTIME_EVENT_REPLAY_LIMIT:500}
  security:
    enabled: ${AGENT_SECURITY_ENABLED:false}
    user-repository: ${AGENT_SECURITY_USER_REPOSITORY:memory}
    jwt:
      issuer: ${AGENT_SECURITY_JWT_ISSUER:xingclaw-agent}
      secret: ${AGENT_SECURITY_JWT_SECRET:}
      ttl: ${AGENT_SECURITY_JWT_TTL:1h}
    bootstrap:
      username: ${AGENT_SECURITY_BOOTSTRAP_USERNAME:}
      password: ${AGENT_SECURITY_BOOTSTRAP_PASSWORD:}
      role: ${AGENT_SECURITY_BOOTSTRAP_ROLE:ADMIN}
  trace:
    repository: ${AGENT_TRACE_REPOSITORY:memory}
  tool-approval:
    repository: ${AGENT_TOOL_APPROVAL_REPOSITORY:memory}
    ttl: ${AGENT_TOOL_APPROVAL_TTL:15m}
    required-tools: ${AGENT_TOOL_APPROVAL_REQUIRED_TOOLS:fileOperationTool,commandExecuteTool}
    recovery-interval: ${AGENT_TOOL_APPROVAL_RECOVERY_INTERVAL:15s}
  kimi:
    request-timeout: ${AGENT_KIMI_REQUEST_TIMEOUT:60s}
    max-tool-rounds: ${AGENT_KIMI_MAX_TOOL_ROUNDS:5}
    history-limit: ${AGENT_KIMI_HISTORY_LIMIT:20}
  memory:
    repository: ${AGENT_MEMORY_REPOSITORY:file}
    file: ${AGENT_MEMORY_FILE:data/chat-memory.jsonl}
  rag:
    index-file: ${AGENT_RAG_INDEX_FILE:data/rag-index.json}
  tools:
    security:
      workspace-root: ${AGENT_WORKSPACE_ROOT:./workspace}
      http:
        allowed-domains:
          - query1.finance.yahoo.com
          - query2.finance.yahoo.com
          - stooq.com
          - www.google.com
          - www.bing.com
          - duckduckgo.com
          - www.baidu.com
        connect-timeout: 2s
        read-timeout: 5s
        max-response-bytes: 8192

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
